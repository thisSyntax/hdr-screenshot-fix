name: Package and release

# Push a tag like v0.1.0 to build the zip and publish it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # lets GITHUB_TOKEN create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}   # CurseForge upload; skipped if no project ID in the .toc
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # GitHub release with the zip attached
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # packager reads tags/history for the version and changelog

      - uses: BigWigsMods/packager@v2
